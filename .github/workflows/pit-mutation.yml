name: PIT Mutation Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  mutation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build & Run Unit Tests
        run: mvn -B clean test

      - name: Run PIT Mutation Tests
        run: mvn org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT Reports
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/

      - name: Create badges folder
        run: mkdir -p badges

      - name: Generate mutation badge
        run: python3 generate-badge.py

      - name: Commit badge to gh-pages
        uses: peaceiris/actions-gh-pages@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges

