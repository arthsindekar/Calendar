name: PIT Mutation Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  mutation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build & Run Unit Tests
        run: mvn -B clean test

      - name: Run PIT Mutation Tests
        run: mvn org.pitest:pitest-maven:mutationCoverage

      - name: Create badges folder
        run: mkdir -p badges

      - name: Generate mutation badge
        run: python3 generate-badge.py

      - name: Publish badge to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
